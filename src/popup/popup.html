<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>反GEO</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; width: 320px;
    font: 400 13px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #1f2937; background: #fff;
  }
  .hd {
    padding: 14px 16px 10px; border-bottom: 1px solid #f0f0f0;
    display: flex; align-items: center; gap: 8px;
  }
  .logo { width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(135deg,#6366f1,#8b5cf6);
          display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 12px; }
  .hd h1 { font-size: 13.5px; margin: 0; font-weight: 700; }
  .hd .ver { margin-left: auto; color: #9ca3af; font-size: 11px; }

  .state { padding: 14px 16px; }
  .state .now { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .pill { padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; color: #fff; background: #9ca3af; }
  .platform { color: #6b7280; font-size: 12px; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
  .stat { background: #f9fafb; border: 1px solid #f0f0f0; border-radius: 8px; padding: 8px; text-align: center; }
  .stat b { display: block; font-size: 17px; line-height: 1.2; }
  .stat span { color: #9ca3af; font-size: 11px; }

  .concl { margin: 10px 0 0; padding: 0; list-style: none; }
  .concl li { font-size: 12px; color: #4b5563; margin: 3px 0; padding-left: 10px; position: relative; }
  .concl li::before { content: "·"; position: absolute; left: 0; color: #9ca3af; }

  .empty { color: #9ca3af; font-size: 12px; text-align: center; padding: 18px 0; }
  .hint { color: #9ca3af; font-size: 11.5px; text-align: center; padding: 6px 16px 0; line-height: 1.5; }

  .ft { border-top: 1px solid #f0f0f0; padding: 10px 16px 14px; display: flex; gap: 8px; }
  button {
    flex: 1; padding: 8px 10px; border-radius: 8px; border: 1px solid #e5e7eb; background: #fff;
    font: inherit; font-size: 12.5px; cursor: pointer; color: #374151;
  }
  button:hover { background: #f9fafb; }
  button.primary { background: #4f46e5; border-color: #4f46e5; color: #fff; }
  button.primary:hover { background: #4338ca; }

  .sw { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; border-bottom: 1px solid #f0f0f0; }
  .sw label { font-size: 12.5px; color: #374151; }
  .toggle { position: relative; width: 36px; height: 20px; }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: #d1d5db; border-radius: 20px; cursor: pointer; transition: .2s; }
  .slider::before { content: ""; position: absolute; width: 16px; height: 16px; left: 2px; top: 2px;
                    background: #fff; border-radius: 50%; transition: .2s; }
  input:checked + .slider { background: #4f46e5; }
  input:checked + .slider::before { transform: translateX(16px); }
</style>
</head>
<body>
  <div class="hd">
    <div class="logo">反</div>
    <h1>反GEO · 引用溯源</h1>
    <span class="ver">v0.1</span>
  </div>

  <div class="sw">
    <label for="en">在 AI 答案页显示检测结果</label>
    <div class="toggle">
      <input type="checkbox" id="en" />
      <span class="slider"></span>
    </div>
  </div>

  <div class="state" id="state">
    <div class="empty">正在读取当前页面…</div>
  </div>

  <div class="hint" id="hint"></div>

  <div class="ft">
    <button id="opts">设置</button>
    <button id="rescan" class="primary">重新检测</button>
  </div>

  <script src="popup.js" type="module"></script>
</body>
</html>
